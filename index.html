<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo-2.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#C9A227" />
    <title>Muhristan | Takı Esans Dünyası</title>
    <meta name="description" content="Muhristan'da en kaliteli takı ve esansları bulun, ruhunuzu keşfedin." />
    <meta name="keywords" content="takı, esans, doğal taşlar, doğal esanslar, Doğal Taş, Doğal Esans" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Muhristan | Takı Esans Dünyası" />
    <meta property="og:description" content="Muhristan'da en kaliteli takı ve esansları bulun, ruhunuzu keşfedin." />
    <meta property="og:image" content="/logo-2.png" />
    <!-- Google Fonts: Cinzel (mystik başlık) + Roboto (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Roboto:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var manual = localStorage.getItem('user_manual_theme');
          var manualTime = parseInt(localStorage.getItem('user_manual_theme_time'), 10);
          var manualHour = parseInt(localStorage.getItem('user_manual_theme_hour'), 10);
          var now = new Date();
          var trHour;
          try {
            var f = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Istanbul', hour: 'numeric', hourCycle: 'h23' });
            trHour = parseInt(f.format(now), 10);
          } catch(e) {
            trHour = (now.getUTCHours() + 3) % 24;
          }
          var autoTheme = (trHour >= 19 || trHour < 7) ? 'dark' : 'light';
          
          if (manual && manualTime && (Date.now() - manualTime < 6 * 3600000)) {
            var wasDay = manualHour >= 7 && manualHour < 19;
            var isDay = trHour >= 7 && trHour < 19;
            if (wasDay === isDay) {
              document.documentElement.setAttribute('data-theme', manual);
              return;
            }
          }
          document.documentElement.setAttribute('data-theme', autoTheme);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
