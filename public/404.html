<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Sayfa Bulunamadı | Muhristan</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="prerender-status-code" content="404" />
    <link rel="icon" href="/logo-2.png" type="image/png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        background-color: #12091F;
        color: #EDE0C8;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }
      .container {
        max-width: 500px;
      }
      h1 {
        font-size: 72px;
        font-weight: 800;
        color: #C9A227;
        margin-bottom: 12px;
        letter-spacing: 2px;
      }
      h2 {
        font-size: 24px;
        font-weight: 600;
        color: #FFFFFF;
        margin-bottom: 16px;
      }
      p {
        font-size: 15px;
        color: #A89BC2;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #E8C547, #9B7A18);
        color: #12091F;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 28px;
        border-radius: 8px;
        text-decoration: none;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 20px rgba(201, 162, 39, 0.35);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(201, 162, 39, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Sayfa Bulunamadı</h2>
      <p>Aradığınız sayfa silinmiş, adı değiştirilmiş veya geçici olarak kullanım dışı kalmış olabilir.</p>
      <a href="/" class="btn">Ana Sayfaya Dön</a>
    </div>
  </body>
</html>
